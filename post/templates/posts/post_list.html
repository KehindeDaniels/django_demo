{% extends 'layout.html' %}

{% block title %}
Post
{% endblock %} 

{% block content %}

{% for post in posts %}

<article>

    <h2>
        <a href="{% url 'page' slug=post.slug %}">
        {{ post.title }}
        </a>
    </h2>
    <p>{{post.date}}</p>
    <p>{{ post.body }}</p>
    
</article>

{% endfor %}

{% endblock  %}
